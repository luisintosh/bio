<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Source for public/og-image-2.jpg (2400×1260). Steps to re-render are next to the og:image tag in index.html. -->
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  /* Laid out at 1200×630 and captured at 2× (2400×1260). LinkedIn shows it about 550px wide,
     so every size here shrinks to under half: keep text 40px or larger. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'JetBrains Mono', monospace;
    color: #1c1c1c;
    background:
      radial-gradient(ellipse 520px 220px at 12% 96%, rgba(255,255,255,.6), transparent 70%),
      radial-gradient(ellipse 600px 240px at 88% 4%, rgba(255,255,255,.5), transparent 70%),
      #68b8d7;
    padding: 22px;
  }
  .card {
    height: 100%;
    background: #fff;
    box-shadow: 0 10px 32px rgba(0,0,0,.18);
    padding: 40px 36px 40px 52px;
    display: grid;
    grid-template-columns: 1fr 450px;
    gap: 36px;
    align-items: center;
  }
  .text { display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
  .name { font-size: 40px; font-weight: 500; letter-spacing: -0.02em; }
  h1 {
    font-size: 58px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    line-height: 1.02;
  }
  .url {
    padding-top: 16px;
    border-top: 2px dotted rgba(28,28,28,.45);
    font-size: 36px;
    color: #2352de;
    font-weight: 500;
  }
  .polaroid {
    transform: rotate(2deg);
    background: #fff;
    padding: 18px 18px 56px;
    box-shadow: 3px 4px 0 rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.2);
  }
  .polaroid img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    filter: grayscale(1) contrast(1.05);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <p class="name">Luis Mendieta</p>
      <h1>Full-stack AI engineer.<br />I ship what works.</h1>
      <p class="url">luism.dev</p>
    </div>
    <div class="polaroid">
      <!-- The 1024px copy of the profile photo, so it stays sharp at 2×. -->
      <img src="preview-image.jpg" alt="" />
    </div>
  </div>
</body>
</html>
