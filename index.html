<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff" />
    <title>Luis Mendieta ★ Senior Full-Stack AI Engineer</title>
    <meta
      name="description"
      content="Senior full-stack AI engineer. I build AI into real products, and plain software when that's the better fix. I start with the people who have the problem, prototype fast, and ship to production: LangGraph agents, RAG, TypeScript, and AWS."
    />
    <meta name="author" content="Luis Mendieta" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Luis Mendieta ★ Senior Full-Stack AI Engineer" />
    <meta
      property="og:description"
      content="Senior full-stack AI engineer. I build AI into real products, and plain software when that's the better fix. I start with the people who have the problem, prototype fast, and ship to production: LangGraph agents, RAG, TypeScript, and AWS."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.luism.dev/" />
    <!--
      og-image-3.jpg is a 2× screenshot (2400×1260) of public/og-card.html. To update it:
      1. Edit the text or styles in public/og-card.html.
      2. Open it in a browser at a 1200×630 viewport with a 2× pixel ratio, e.g.:
         agent-browser set viewport 1200 630 2 && agent-browser open "file://$PWD/public/og-card.html"
         agent-browser screenshot og.png
      3. Convert to JPG: sips -s format jpeg -s formatOptions 85 og.png --out public/og-image-3.jpg
      4. Rename the file (and both image tags) if links were already shared, so
         LinkedIn, X, and Slack fetch it fresh; then refresh it in LinkedIn's Post Inspector.
    -->
    <meta
      property="og:image"
      content="https://www.luism.dev/og-image-3.jpg"
    />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Luis Mendieta, Senior Full-Stack AI Engineer. Full-stack AI engineer. I ship what works."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luis Mendieta ★ Senior Full-Stack AI Engineer" />
    <meta
      name="twitter:description"
      content="Senior full-stack AI engineer. I build AI into real products, and plain software when that's the better fix. I start with the people who have the problem, prototype fast, and ship to production: LangGraph agents, RAG, TypeScript, and AWS."
    />
    <meta
      name="twitter:image"
      content="https://www.luism.dev/og-image-3.jpg"
    />
    <meta name="twitter:creator" content="@luisintosh" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only weights used in CSS: 300, 400, 500 -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- LCP: polaroid photo (AVIF; unsupported browsers ignore and use <picture>) -->
    <link
      rel="preload"
      as="image"
      href="/assets/links/profile.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <style>
      /* Critical shell — paints before JS/CSS chunks */
      :root {
        --mat: #68b8d7;
        --paper: #f5f5f2;
        --ink: #1c1c1c;
        --white: #ffffff;
        --column: 880px;
        --font: 'JetBrains Mono', ui-monospace, monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        color: var(--ink);
        background: #68b8d7;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .galaxy {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: #68b8d7;
      }
      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        padding: 40px 16px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .column {
        width: min(var(--column), 100%);
        background: var(--paper);
        position: relative;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      .intro {
        position: relative;
        padding: 28px 40px 44px;
        background: var(--white);
      }
      .intro__headline {
        font-size: clamp(32px, 5.6vw, 50px);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      @media (max-width: 640px) {
        .page {
          padding: 24px 0 32px;
        }
        .column {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
