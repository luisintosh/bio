<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff" />
    <title>Luis Mendieta ★ Software Engineer</title>
    <meta
      name="description"
      content="Lead Full-Stack AI Engineer | React, Node.js, Langchain."
    />
    <meta name="author" content="Luis Mendieta" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Luis Mendieta ★ Software Engineer" />
    <meta
      property="og:description"
      content="Lead Full-Stack AI Engineer | React, Node.js, Langchain."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.luism.dev/" />
    <meta
      property="og:image"
      content="https://www.luism.dev/preview-image.jpg"
    />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luis Mendieta ★ Software Engineer" />
    <meta
      name="twitter:description"
      content="Lead Full-Stack AI Engineer | React, Node.js, Langchain."
    />
    <meta
      name="twitter:image"
      content="https://www.luism.dev/preview-image.jpg"
    />
    <meta name="twitter:image:width" content="1024" />
    <meta name="twitter:image:height" content="1024" />
    <meta name="twitter:creator" content="@luisintosh" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only weights used in CSS: 300, 400, 500 -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- LCP: polaroid photo (AVIF; unsupported browsers ignore and use <picture>) -->
    <link
      rel="preload"
      as="image"
      href="/assets/links/profile.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <style>
      /* Critical shell — paints before JS/CSS chunks */
      :root {
        --mat: #68b8d7;
        --paper: #f5f5f2;
        --ink: #1c1c1c;
        --white: #ffffff;
        --column: 600px;
        --font: 'JetBrains Mono', ui-monospace, monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        color: var(--ink);
        background: #68b8d7;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .galaxy {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: #68b8d7;
      }
      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        padding: 40px 16px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .column {
        width: min(var(--column), 100%);
        background: var(--paper);
        position: relative;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      .intro {
        position: relative;
        padding: 48px 30px 30px;
        background: var(--white);
      }
      .intro__name {
        display: flex;
        flex-direction: column;
        font-size: clamp(42px, 10vw, 88px);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: -0.03em;
        line-height: 0.88;
      }
      @media (max-width: 640px) {
        .page {
          padding: 24px 0 32px;
        }
        .column {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
