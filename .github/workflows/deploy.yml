name: Deploy to GitHub Pages

# Pushes to main deploy; pull requests only build, to catch failures before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal permissions for a GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs with pnpm (from packageManager / pnpm-lock.yaml), lints, builds
      # the static site to ./dist, and uploads it as the Pages artifact.
      - name: Install, lint, build, and upload
        uses: withastro/action@v6
        with:
          build-cmd: pnpm lint && pnpm build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
